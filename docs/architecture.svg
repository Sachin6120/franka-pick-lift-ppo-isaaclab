<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box { fill: #f5f7fa; stroke: #2b3a55; stroke-width: 1.5; rx: 6; }
    .box-accent { fill: #eaf2ff; stroke: #1f5fbf; stroke-width: 1.5; rx: 6; }
    .box-reward { fill: #eefaf0; stroke: #1f8a3d; stroke-width: 1.5; rx: 6; }
    .label { font-size: 15px; fill: #14213d; font-weight: 600; }
    .sublabel { font-size: 12px; fill: #445; }
    .arrow { stroke: #333; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  </style>

  <!-- explicit light background so the diagram stays readable in GitHub dark mode -->
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <!-- Randomized cube state -->
  <rect class="box" x="320" y="10" width="260" height="46"/>
  <text class="label" x="450" y="38" text-anchor="middle">Randomized cube XY position</text>

  <line class="arrow" x1="450" y1="56" x2="450" y2="90"/>

  <!-- Observation manager -->
  <rect class="box" x="320" y="90" width="260" height="46"/>
  <text class="label" x="450" y="118" text-anchor="middle">Observation manager</text>

  <line class="arrow" x1="450" y1="136" x2="450" y2="170"/>

  <!-- 32-D observation -->
  <rect class="box-accent" x="220" y="170" width="460" height="86"/>
  <text class="label" x="450" y="196" text-anchor="middle">32-D policy observation</text>
  <text class="sublabel" x="450" y="218" text-anchor="middle" textLength="400" lengthAdjust="spacingAndGlyphs">joint pos(9) + joint vel(9) + cube-in-root(3)</text>
  <text class="sublabel" x="450" y="236" text-anchor="middle">+ cube-in-EE(3) + last action(8)</text>

  <line class="arrow" x1="450" y1="256" x2="450" y2="290"/>

  <!-- PPO actor -->
  <rect class="box-accent" x="320" y="290" width="260" height="46"/>
  <text class="label" x="450" y="318" text-anchor="middle">PPO actor (RSL-RL)</text>

  <line class="arrow" x1="450" y1="336" x2="450" y2="370"/>

  <!-- 8 actions -->
  <rect class="box-accent" x="220" y="370" width="460" height="50"/>
  <text class="label" x="450" y="400" text-anchor="middle" textLength="410" lengthAdjust="spacingAndGlyphs">7 arm joint-position actions + 1 gripper action</text>

  <line class="arrow" x1="450" y1="420" x2="450" y2="454"/>

  <!-- Franka / PhysX -->
  <rect class="box" x="320" y="454" width="260" height="46"/>
  <text class="label" x="450" y="482" text-anchor="middle">Franka Panda / PhysX simulation</text>

  <line class="arrow" x1="450" y1="500" x2="450" y2="534"/>

  <!-- reward + success -->
  <rect class="box-reward" x="210" y="534" width="480" height="50"/>
  <text class="label" x="450" y="564" text-anchor="middle" textLength="440" lengthAdjust="spacingAndGlyphs">reward manager + sustained-lift success evaluation</text>

  <!-- feedback loop back to actor (training only) -->
  <path class="arrow" d="M 690 559 C 900 559, 900 313, 582 313" fill="none"/>
  <text class="sublabel" x="920" y="436" text-anchor="middle" transform="rotate(-90 920 436)">PPO policy gradient (training only)</text>
</svg>
